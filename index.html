<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snakes and Ladder</title>
<style>
  :root {
    --navy: #061c52;
    --navy-dark: #020b24;
    --royal-blue: #0876ed;
    --cyan: #02a5eb;
    --cyan-light: #40e8ff;
    --purple: #582bc2;
    --gold: #ffd85b;
    --gold-glow: rgba(255, 216, 91, 0.6);
    --cream: #fdfbf7;
    
    --c-coral: #ff5d66;
    --c-blue: #1878ee;
    --c-green: #18a75b;
    --c-purple: #8a4de1;
    --c-orange: #ef8b20;

    --font-main: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(circle at center, var(--navy) 0%, var(--navy-dark) 100%);
    color: var(--cream);
    font-family: var(--font-main);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 4vw;
    background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
  }
  
  .header-title-img {
    width: min(72vw, 720px);
    height: 120px;
    object-fit: cover;
    object-position: left 40%;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,0.6));
  }

  .sound-btn {
    background: var(--royal-blue);
    color: white;
    border: 2px solid var(--cyan-light);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    transition: transform 0.1s, background 0.2s;
  }
  .sound-btn:active { transform: scale(0.95); }

  /* Main Layout */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
  }

  /* Settings Screen */
  #settings-view {
    background: var(--cream);
    color: var(--navy);
    padding: 30px;
    border-radius: 20px;
    border: 4px solid var(--cyan);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    width: 100%;
    max-width: 800px;
    margin-top: 20px;
  }
  #settings-view h1 { color: var(--royal-blue); text-align: center; margin-bottom: 5px; }
  #settings-view p.subtitle { text-align: center; color: #555; margin-bottom: 25px; }

  .mode-cards { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .mode-card {
    flex: 1; min-width: 200px;
    background: #eee; border: 3px solid #ccc; border-radius: 12px;
    padding: 20px; text-align: center; cursor: pointer;
    font-size: 18px; font-weight: bold;
    transition: all 0.2s;
  }
  .mode-card[aria-pressed="true"] {
    background: #e0f7fa; border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan);
  }

  .player-counts { display: none; gap: 10px; justify-content: center; margin-top: 15px; }
  .player-counts button {
    padding: 10px 20px; font-size: 16px; border-radius: 8px; border: 2px solid #ccc;
    background: white; cursor: pointer;
  }
  .player-counts button.active { border-color: var(--c-blue); background: var(--c-blue); color: white; }

  .names-section, .questions-section {
    background: #f5f5f5; border-radius: 12px; padding: 20px; margin-bottom: 20px;
    border: 1px solid #ddd;
  }
  .names-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
  .name-input-group { display: flex; flex-direction: column; }
  .name-input-group label { font-size: 14px; margin-bottom: 5px; font-weight: bold; }
  .name-input-group input { padding: 10px; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; }
  
  .btn-green {
    background: var(--c-green); color: white; border: none; padding: 12px 24px;
    font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: background 0.2s;
  }
  .btn-green:hover { background: #138749; }
  .btn-start { width: 100%; font-size: 20px; padding: 16px; margin-top: 10px; }

  details { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ccc; }
  summary { font-weight: bold; font-size: 18px; cursor: pointer; color: var(--royal-blue); margin-bottom: 10px; }
  
  .q-editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
  .q-editor-grid textarea { width: 100%; height: 150px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; resize: vertical; }
  
  .single-q-editor { margin-top: 20px; padding-top: 20px; border-top: 2px dashed #ccc; }
  .single-q-editor select, .single-q-editor input { padding: 8px; margin-bottom: 10px; width: 100%; max-width: 300px; display: block; border: 1px solid #ccc; border-radius: 4px; }
  
  .status-msg { margin-top: 10px; font-weight: bold; min-height: 20px; }
  .success { color: var(--c-green); }
  .error { color: var(--c-coral); }

  /* Game View */
  #game-view {
    display: none; width: 100%; gap: 30px;
    justify-content: center; align-items: flex-start;
  }

  .board-column { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 800px; }
  .top-controls { width: 100%; display: flex; justify-content: space-between; margin-bottom: 15px; }
  .btn-secondary {
    background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--cyan);
    padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.2); }

  /* Game Board Area */
  .game-board-area { position: relative; width: 100%; max-width: 800px; }
  .board-frame {
    background: linear-gradient(135deg, var(--cyan-light), var(--royal-blue), var(--purple), var(--cyan));
    padding: 10px; border-radius: 24px;
    box-shadow: 0 0 40px var(--gold-glow), inset 0 0 20px rgba(0,0,0,0.6);
    position: relative;
  }
  .board-inner {
    background: var(--navy); border-radius: 16px; overflow: hidden;
    position: relative; aspect-ratio: 5 / 4;
  }

  .board-bg-img {
    position: absolute; left: 49.5%; top: 52.8%; width: 120%; height: 123%;
    transform: translate(-50%, -50%); object-fit: fill;
    pointer-events: none; user-select: none; z-index: 1;
  }

  .board-grid {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(4, 1fr);
    z-index: 2;
  }
  
  .square { position: relative; }
  
  /* Question Icons */
  .question-btn {
    position: absolute; top: 11%; right: 7%;
    width: clamp(20px, 3.5vw, 32px); height: clamp(20px, 3.5vw, 32px);
    border-radius: 50%; border: 2px solid white; color: white; font-weight: bold;
    font-size: clamp(12px, 2vw, 18px); display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); z-index: 4;
    transition: transform 0.2s;
  }
  .question-btn:hover { transform: scale(1.1); }
  .question-btn span { display: none; }
  #sq-10 .question-btn { right: 24%; }
  
  .q-c0 { background: var(--c-green); }
  .q-c1 { background: var(--c-blue); }
  .q-c2 { background: var(--c-purple); }
  .q-c3 { background: var(--c-coral); }
  .q-c4 { background: var(--c-orange); }
  .question-btn.has-q { background: var(--c-green); box-shadow: 0 0 10px var(--c-green), 0 2px 5px rgba(0,0,0,0.5); }

  /* Dock */
  .dock-container {
    width: 80%; margin: 20px auto 0; background: var(--navy-dark);
    border: 3px solid var(--royal-blue); border-radius: 16px;
    padding: 10px; text-align: center; box-shadow: inset 0 0 15px #000;
  }
  .dock-title { color: var(--cyan); font-weight: bold; margin-bottom: 10px; letter-spacing: 1px; }
  .dock-area { height: 50px; position: relative; }

  /* Tokens */
  .token {
    position: absolute;
    width: clamp(24px, 4vw, 42px); height: clamp(24px, 4vw, 42px);
    border-radius: 50%; border: 2px solid white;
    box-shadow: 0 4px 6px rgba(0,0,0,0.6), inset 0 -4px 6px rgba(0,0,0,0.3);
    color: white; font-weight: bold; display: flex; align-items: center; justify-content: center;
    font-size: clamp(12px, 2vw, 18px); text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    transform: translate(-50%, -50%); z-index: 5;
    transition: left 0.3s ease-in-out, top 0.3s ease-in-out;
  }
  .token.hop { transform: translate(-50%, -80%) scale(1.1); }
  
  .t-0 { background: radial-gradient(circle at 30% 30%, #ff8a90, var(--c-coral)); }
  .t-1 { background: radial-gradient(circle at 30% 30%, #4b9fff, var(--c-blue)); }
  .t-2 { background: radial-gradient(circle at 30% 30%, #4ade8e, var(--c-green)); }
  .t-3 { background: radial-gradient(circle at 30% 30%, #b27bf5, var(--c-purple)); }
  .t-4 { background: radial-gradient(circle at 30% 30%, #ffb15c, var(--c-orange)); }

  /* Control Panel */
  .control-column {
    width: 300px; min-width: 250px; background: var(--cream); color: var(--navy);
    border: 4px solid var(--cyan); border-radius: 20px; padding: 20px;
    box-shadow: 0 0 0 6px var(--royal-blue), 0 10px 20px rgba(0,0,0,0.6);
    position: sticky; top: 20px; display: flex; flex-direction: column; align-items: center;
  }
  .ctrl-title { font-size: 14px; font-weight: bold; color: #666; letter-spacing: 1px; }
  .active-player-name { font-size: 24px; font-weight: bold; color: var(--royal-blue); margin-bottom: 5px; text-align: center; }
  .status-text { text-align: center; font-size: 16px; margin-bottom: 20px; min-height: 40px; color: #333; }

  /* Avatar & Dice Area */
  .avatar-dice-row { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
  .avatar-box { position: relative; width: 80px; height: 80px; }
  .avatar-img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; border: 2px solid var(--royal-blue); }
  .anim-q { position: absolute; font-weight: bold; color: var(--c-orange); text-shadow: 1px 1px 0 #fff; animation: floatQ 2s infinite ease-in-out; }
  .anim-q:nth-child(2) { top: -20px; left: 10px; animation-delay: 0s; font-size: 20px; }
  .anim-q:nth-child(3) { top: -10px; left: 40px; animation-delay: 0.6s; font-size: 16px; }
  .anim-q:nth-child(4) { top: -25px; left: 60px; animation-delay: 1.2s; font-size: 24px; }
  
  @keyframes floatQ { 0%, 100% { transform: translateY(0); opacity: 0.8; } 50% { transform: translateY(-10px); opacity: 1; } }

  /* 3D Dice */
  .dice-stage {
    width: 96px; height: 96px; perspective: 400px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer; padding: 0; outline: none;
  }
  .dice-stage:focus-visible { outline: 3px solid var(--c-orange); border-radius: 12px; }
  .dice-stage:disabled { cursor: not-allowed; opacity: 0.8; }
  
  .dice-cube {
    width: 76px; height: 76px; position: relative; transform-style: preserve-3d;
    transform: rotateX(-12deg) rotateY(16deg); transition: transform 1s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .dice-face {
    position: absolute; width: 76px; height: 76px; border-radius: 15px;
    background: linear-gradient(135deg, #32dfff, #087cf4, #0a439f, #061c52);
    border: 3px solid var(--gold); box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 10px rgba(0,0,0,0.3);
    display: grid; padding: 12px; gap: 4px;
  }
  .pip {
    background: radial-gradient(circle, #fff 0%, var(--gold) 100%);
    border-radius: 50%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 5px var(--gold-glow);
    width: 100%; height: 100%;
  }

  .face-front  { transform: translateZ(38px); }
  .face-back   { transform: rotateY(180deg) translateZ(38px); }
  .face-right  { transform: rotateY(90deg) translateZ(38px); }
  .face-left   { transform: rotateY(-90deg) translateZ(38px); }
  .face-top    { transform: rotateX(90deg) translateZ(38px); }
  .face-bottom { transform: rotateX(-90deg) translateZ(38px); }

  /* Pip layouts */
  .face-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; place-items: center; }
  .face-1 .pip { width: 16px; height: 16px; }
  .face-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .face-2 .pip:nth-child(1) { align-self: start; justify-self: start; }
  .face-2 .pip:nth-child(2) { align-self: end; justify-self: end; grid-column: 2; grid-row: 2; }
  .face-3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
  .face-3 .pip:nth-child(1) { grid-column: 1; grid-row: 1; }
  .face-3 .pip:nth-child(2) { grid-column: 2; grid-row: 2; }
  .face-3 .pip:nth-child(3) { grid-column: 3; grid-row: 3; }
  .face-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; align-items: space-between; justify-content: space-between; }
  .face-5 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; }
  .face-5 .pip:nth-child(1) { grid-column: 1; grid-row: 1; }
  .face-5 .pip:nth-child(2) { grid-column: 3; grid-row: 1; }
  .face-5 .pip:nth-child(3) { grid-column: 2; grid-row: 2; }
  .face-5 .pip:nth-child(4) { grid-column: 1; grid-row: 3; }
  .face-5 .pip:nth-child(5) { grid-column: 3; grid-row: 3; }
  .face-6 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; row-gap: 6px;}

  .move-btn {
    display: none; width: 100%; background: var(--c-orange); color: white; border: none;
    padding: 12px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer;
    box-shadow: 0 0 15px var(--gold-glow); animation: pulseBtn 1s infinite alternate; margin-bottom: 20px;
  }
  @keyframes pulseBtn { from { transform: scale(1); } to { transform: scale(1.05); } }

  .player-list { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .p-row {
    display: flex; align-items: center; padding: 8px; border-radius: 8px;
    background: #f0f0f0; border: 2px solid transparent; transition: border-color 0.2s;
  }
  .p-row.active-row { border-color: var(--royal-blue); background: #e0f0ff; }
  .p-dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); margin-right: 10px; }
  .p-name { flex: 1; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-score { font-weight: bold; color: #555; }

  /* Footer Signature */
  footer { text-align: center; margin-top: 30px; padding-bottom: 20px; }
  .sig-name { font-size: 18px; font-weight: bold; color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
  .sig-title { font-size: 14px; color: var(--cream); margin-top: 4px; }

  /* Modals */
  dialog {
    margin: auto; padding: 30px; border: none; border-radius: 16px;
    background: var(--cream); color: var(--navy); box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    width: 90%; max-width: 500px; text-align: center; font-family: var(--font-main);
  }
  dialog::backdrop { background: rgba(0,0,50,0.8); backdrop-filter: blur(4px); }
  .modal-title { color: var(--royal-blue); margin-bottom: 15px; }
  .modal-q-text { font-size: 18px; margin-bottom: 20px; font-weight: bold; }
  .modal-input {
    width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ccc;
    border-radius: 8px; margin-bottom: 15px;
  }
  .modal-buttons { display: flex; gap: 10px; justify-content: center; }
  .modal-feedback { margin-top: 15px; font-weight: bold; min-height: 24px; }

  #victory-modal { background: radial-gradient(circle, var(--royal-blue), var(--navy)); color: white; border: 4px solid var(--gold); }
  .trophy-icon { font-size: 80px; margin-bottom: 10px; filter: drop-shadow(0 0 20px var(--gold)); }

  /* Confetti */
  .confetti { position: fixed; width: 10px; height: 10px; background: red; z-index: 9999; animation: fall 3s linear infinite; pointer-events: none; }
  @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

  /* Responsive */
  @media (max-width: 850px) {
    #game-view { flex-direction: column; align-items: center; gap: 20px; }
    .control-column { position: static; width: 100%; max-width: 600px; }
    footer { margin-top: 10px; }
  }
  @media (max-width: 480px) {
    header { padding: 10px 2vw; }
    .header-title-img { width: min(64vw, 250px); height: 46px; }
    .sound-btn { padding: 6px 10px; font-size: 14px; }
    .board-frame { padding: 6px; border-radius: 16px; }
    .board-inner { border-radius: 10px; }
    .control-column { padding: 15px; }
    .avatar-box { width: 60px; height: 60px; }
    .anim-q:nth-child(4) { display: none; }
    #settings-view { padding: 15px; }
    .q-editor-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <img id="title-img" class="header-title-img" alt="SNAKES AND LADDER" src="https://raw.githubusercontent.com/cs0028monglish-cmd/pictures-for-my-site-/main/title%20for%20snakes%20and%20ladder%20.png">
  <button id="sound-toggle" class="sound-btn" aria-pressed="true" aria-label="Toggle Sound">🔊 Sound on</button>
</header>

<main>
  <!-- SETTINGS VIEW -->
  <section id="settings-view" aria-labelledby="settings-heading">
    <h1 id="settings-heading">Set up your game</h1>
    <p class="subtitle">Choose how to play, save the player names, and add your learning questions.</p>
    
    <div class="mode-cards" role="group" aria-label="Play modes">
      <button class="mode-card" id="mode-cpu" aria-pressed="false">🤖 Versus computer</button>
      <button class="mode-card" id="mode-local" aria-pressed="false">👥 Various players</button>
    </div>

    <div class="player-counts" id="player-count-box">
      <button class="p-count-btn" data-count="2">2 Players</button>
      <button class="p-count-btn" data-count="3">3 Players</button>
      <button class="p-count-btn" data-count="4">4 Players</button>
      <button class="p-count-btn" data-count="5">5 Players</button>
    </div>

    <div class="names-section">
      <div class="names-grid" id="names-grid"></div>
      <button class="btn-green" id="btn-save-names">Save player names</button>
      <span id="names-status" class="status-msg"></span>
    </div>

    <details class="questions-section">
      <summary>Add or edit my questions</summary>
      <div class="q-editor-grid">
        <div>
          <label for="bulk-q">Questions, one per line</label>
          <textarea id="bulk-q" aria-label="Bulk questions"></textarea>
        </div>
        <div>
          <label for="bulk-a">Answers, one per line</label>
          <textarea id="bulk-a" aria-label="Bulk answers"></textarea>
        </div>
      </div>
      <button class="btn-green" id="btn-save-bulk" style="margin-top:10px;">Save bulk list</button>
      <span id="bulk-status" class="status-msg"></span>

      <div class="single-q-editor">
        <label for="sq-select">Edit single square:</label>
        <select id="sq-select"></select>
        <label for="sq-q">Question:</label>
        <input type="text" id="sq-q">
        <label for="sq-a">Exact Answer:</label>
        <input type="text" id="sq-a">
        <div style="display:flex; gap:10px;">
          <button class="btn-green" id="btn-save-single">Save this square</button>
          <button class="btn-secondary" id="btn-clear-single" style="color:var(--navy); border-color:#ccc;">Clear this square</button>
        </div>
        <span id="single-status" class="status-msg"></span>
      </div>
    </details>

    <button class="btn-green btn-start" id="btn-start">Start the game ▶</button>
  </section>

  <!-- GAME VIEW -->
  <section id="game-view" aria-label="Game Area">
    <div class="board-column">
      <div class="top-controls">
        <button class="btn-secondary" id="btn-back">← Back to settings</button>
        <button class="btn-secondary" id="btn-restart">↻ Restart game</button>
      </div>

      <div class="game-board-area" id="game-board-area">
        <div class="board-frame">
          <div class="board-inner">
            <img id="board-img" class="board-bg-img" alt="Game Board Artwork" src="https://raw.githubusercontent.com/cs0028monglish-cmd/pictures-for-my-site-/main/snakes%20and%20Ladder.png">
            <div class="board-grid" id="board-grid" aria-label="Snakes and Ladders Board">
              <!-- Squares generated by JS -->
            </div>
          </div>
        </div>
        <div class="dock-container" id="dock" aria-label="Starting Dock">
          <div class="dock-title">STARTING DOCK</div>
          <div class="dock-area" id="dock-area"></div>
        </div>
      </div>
    </div>

    <aside class="control-column" aria-label="Game Controls">
      <div class="ctrl-title">CURRENT TURN</div>
      <div class="active-player-name" id="active-p-name" aria-live="polite">Player 1</div>
      <div class="status-text" id="status-text" aria-live="assertive">Click the dice to roll.</div>

      <div class="avatar-dice-row">
        <div class="avatar-box">
          <img id="avatar-img" class="avatar-img" alt="Side panel avatar" src="https://raw.githubusercontent.com/cs0028monglish-cmd/pictures-for-my-site-/main/snakes%20and%20ladder%203.png">
          <span class="anim-q">?</span>
          <span class="anim-q">?</span>
          <span class="anim-q">?</span>
        </div>
        
        <button class="dice-stage" id="dice-btn" aria-label="Roll Dice">
          <div class="dice-cube" id="dice-cube">
            <div class="dice-face face-front face-1"><div class="pip"></div></div>
            <div class="dice-face face-back face-6"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
            <div class="dice-face face-right face-3"><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
            <div class="dice-face face-left face-4"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
            <div class="dice-face face-top face-2"><div class="pip"></div><div class="pip"></div></div>
            <div class="dice-face face-bottom face-5"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
          </div>
        </button>
      </div>

      <button class="move-btn" id="move-btn"></button>

      <div class="player-list" id="player-list" aria-label="Player Scores"></div>
    </aside>
  </section>
</main>

<footer>
  <div class="sig-name">Dr.Abir Wafa</div>
  <div class="sig-title">Head of EdTech at Edulixa</div>
</footer>

<!-- Modals -->
<dialog id="q-modal" aria-labelledby="q-modal-title">
  <h2 id="q-modal-title" class="modal-title">Square Question</h2>
  <div class="modal-q-text" id="q-text"></div>
  <input type="text" id="q-input" class="modal-input" placeholder="Type your answer here...">
  <div class="modal-buttons">
    <button class="btn-secondary" id="btn-close-q" style="color:var(--navy); border-color:#ccc;">Close</button>
    <button class="btn-green" id="btn-check-q">Check my answer</button>
  </div>
  <div class="modal-feedback" id="q-feedback" aria-live="assertive"></div>
</dialog>

<dialog id="victory-modal" aria-labelledby="victory-title">
  <div class="trophy-icon">🏆</div>
  <h1 id="victory-title">Victory!</h1>
  <p id="victory-msg" style="font-size: 20px; margin: 15px 0 25px;"></p>
  <button class="btn-green" id="btn-play-again" style="background:var(--gold); color:var(--navy);">Play again</button>
</dialog>

<script>
// --- STATE MANAGEMENT ---
const state = {
  mode: 'cpu', // 'cpu' or 'local'
  playerCount: 2,
  savedNames: [],
  players: [], // { name, color, pos, trophies: Set }
  activeIndex: 0,
  rolledValue: 0,
  busy: false,
  sound: true,
  questions: {}, // '1' to '20': {q, a}
  openSquare: null,
  gameOver: false
};

const COLORS = ['var(--c-coral)', 'var(--c-blue)', 'var(--c-green)', 'var(--c-purple)', 'var(--c-orange)'];
const LADDERS = { 2: 9, 7: 14, 12: 19 };
const SNAKES = { 11: 10, 13: 8, 15: 6 };

// Serpentine layout exactly as specified
const GRID_ORDER = [
  20, 19, 18, 17, 16,
  11, 12, 13, 14, 15,
  10, 9, 8, 7, 6,
  1, 2, 3, 4, 5
];

// --- WEB AUDIO API ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, type, duration, vol=0.1, slideFreq=null) {
  if (!state.sound || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slideFreq) {
      osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
    }
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

const sounds = {
  click: () => playTone(600, 'sine', 0.1, 0.1),
  save: () => playTone(800, 'square', 0.15, 0.05),
  roll: () => { playTone(400, 'triangle', 0.1, 0.1); setTimeout(()=>playTone(500, 'triangle', 0.1, 0.1), 100); },
  step: () => playTone(300, 'sine', 0.1, 0.1),
  blocked: () => playTone(150, 'sawtooth', 0.3, 0.1),
  ladder: () => playTone(300, 'sine', 0.6, 0.1, 800),
  snake: () => playTone(400, 'sawtooth', 0.6, 0.1, 100),
  wrong: () => playTone(200, 'square', 0.3, 0.1, 150),
  correct: () => { playTone(523.25, 'sine', 0.15); setTimeout(()=>playTone(659.25, 'sine', 0.3), 150); },
  trophy: () => { playTone(659.25, 'triangle', 0.2); setTimeout(()=>playTone(783.99, 'triangle', 0.2), 200); setTimeout(()=>playTone(1046.50, 'triangle', 0.4), 400); },
  win: () => {
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
      setTimeout(() => playTone(f, 'square', 0.5, 0.1), i * 200);
    });
  }
};

// --- UTILS ---
const $ = id => document.getElementById(id);
const escapeHTML = str => str.replace(/[&<>'"]/g, 
  tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

// --- SETTINGS LOGIC ---
function loadSettings() {
  try {
    const sn = localStorage.getItem('snakeTrailNames');
    if (sn) state.savedNames = JSON.parse(sn);
    const sq = localStorage.getItem('snakeTrailQuestions');
    if (sq) state.questions = JSON.parse(sq);
  } catch(e) {}
  
  const sel = $('sq-select');
  sel.innerHTML = '';
  for(let i=1; i<=20; i++) {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `Square ${i}`;
    sel.appendChild(opt);
  }
  sel.addEventListener('change', () => {
    const qd = state.questions[sel.value] || {q:'', a:''};
    $('sq-q').value = qd.q;
    $('sq-a').value = qd.a;
    $('single-status').textContent = '';
  });
  sel.dispatchEvent(new Event('change'));
  renderNameInputs();
}

function renderNameInputs() {
  const grid = $('names-grid');
  grid.innerHTML = '';
  for(let i=0; i<state.playerCount; i++) {
    const isCPU = (state.mode === 'cpu' && i === 1);
    const div = document.createElement('div');
    div.className = 'name-input-group';
    let defaultVal = isCPU ? 'CPU' : (state.savedNames[i] || '');
    div.innerHTML = `
      <label for="pname-${i}">Player ${i+1} Name</label>
      <input type="text" id="pname-${i}" maxlength="22" value="${escapeHTML(defaultVal)}" ${isCPU ? 'disabled' : ''}>
    `;
    grid.appendChild(div);
  }
  $('names-status').textContent = '';
  document.querySelectorAll('.names-grid input').forEach(inpt => {
    inpt.addEventListener('input', () => { $('names-status').textContent = 'Unsaved changes'; $('names-status').className = 'status-msg error'; });
  });
}

function setMode(mode) {
  state.mode = mode;
  $('mode-cpu').setAttribute('aria-pressed', mode === 'cpu');
  $('mode-local').setAttribute('aria-pressed', mode === 'local');
  $('player-count-box').style.display = mode === 'local' ? 'flex' : 'none';
  if(mode === 'cpu') state.playerCount = 2;
  renderNameInputs();
}

$('mode-cpu').addEventListener('click', () => { sounds.click(); setMode('cpu'); });
$('mode-local').addEventListener('click', () => { sounds.click(); setMode('local'); });

document.querySelectorAll('.p-count-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    sounds.click();
    document.querySelectorAll('.p-count-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    state.playerCount = parseInt(e.target.dataset.count);
    renderNameInputs();
  });
});

$('btn-save-names').addEventListener('click', () => {
  initAudio(); sounds.save();
  const names = [];
  for(let i=0; i<state.playerCount; i++) {
    let val = $(`pname-${i}`).value.trim();
    if(state.mode === 'cpu' && i === 1) val = 'CPU';
    names.push(val);
  }
  state.savedNames = names;
  localStorage.setItem('snakeTrailNames', JSON.stringify(names));
  $('names-status').textContent = `✓ ${names.length} names saved`;
  $('names-status').className = 'status-msg success';
});

$('btn-save-bulk').addEventListener('click', () => {
  initAudio();
  const qs = $('bulk-q').value.split('\n').map(s=>s.trim()).filter(s=>s);
  const as = $('bulk-a').value.split('\n').map(s=>s.trim()).filter(s=>s);
  if(qs.length === 0 || qs.length !== as.length) {
    $('bulk-status').textContent = 'Error: Need equal non-empty lines.';
    $('bulk-status').className = 'status-msg error';
    sounds.wrong();
    return;
  }
  const max = Math.min(qs.length, 20);
  for(let i=0; i<max; i++) {
    state.questions[i+1] = { q: qs[i], a: as[i] };
  }
  localStorage.setItem('snakeTrailQuestions', JSON.stringify(state.questions));
  $('bulk-status').textContent = `✓ Saved ${max} questions`;
  $('bulk-status').className = 'status-msg success';
  sounds.save();
  $('sq-select').dispatchEvent(new Event('change'));
});

$('btn-save-single').addEventListener('click', () => {
  initAudio();
  const sq = $('sq-select').value;
  const q = $('sq-q').value.trim();
  const a = $('sq-a').value.trim();
  if(!q || !a) {
    $('single-status').textContent = 'Error: Need both Q and A.';
    $('single-status').className = 'status-msg error';
    sounds.wrong(); return;
  }
  state.questions[sq] = { q, a };
  localStorage.setItem('snakeTrailQuestions', JSON.stringify(state.questions));
  $('single-status').textContent = `✓ Square ${sq} saved`;
  $('single-status').className = 'status-msg success';
  sounds.save();
});

$('btn-clear-single').addEventListener('click', () => {
  initAudio();
  const sq = $('sq-select').value;
  delete state.questions[sq];
  localStorage.setItem('snakeTrailQuestions', JSON.stringify(state.questions));
  $('sq-q').value = ''; $('sq-a').value = '';
  $('single-status').textContent = `✓ Square ${sq} cleared`;
  $('single-status').className = 'status-msg success';
  sounds.click();
});

// --- GAME INITIALIZATION ---
function startGame() {
  initAudio(); sounds.click();
  state.players = [];
  for(let i=0; i<state.playerCount; i++) {
    let raw = state.savedNames[i] || `P${i+1}`;
    if(state.mode === 'cpu' && i === 1) raw = 'CPU';
    state.players.push({ name: raw, color: COLORS[i], pos: 0, trophies: new Set() });
  }
  state.activeIndex = 0;
  state.rolledValue = 0;
  state.busy = false;
  state.gameOver = false;

  $('settings-view').style.display = 'none';
  $('game-view').style.display = 'flex';
  
  buildBoard();
  createTokens();
  updateUI();
  updateTokenPositions();
}

$('btn-start').addEventListener('click', startGame);

function buildBoard() {
  const grid = $('board-grid');
  grid.innerHTML = '';
  GRID_ORDER.forEach((num) => {
    const div = document.createElement('div');
    div.className = 'square';
    div.id = 'sq-' + num;
    
    const btn = document.createElement('button');
    btn.className = `question-btn q-c${(num-1)%5}`;
    if(state.questions[num] && state.questions[num].q) btn.classList.add('has-q');
    btn.innerHTML = `?<span>${num}</span>`;
    btn.setAttribute('aria-label', `Open question for square ${num}`);
    btn.onclick = () => openQuestion(num);
    div.appendChild(btn);
    grid.appendChild(div);
  });
}

function createTokens() {
  document.querySelectorAll('.token').forEach(t => t.remove());
  const area = $('game-board-area');
  state.players.forEach((p, i) => {
    const t = document.createElement('div');
    t.className = `token t-${i}`;
    t.id = 'token-' + i;
    t.textContent = i + 1;
    area.appendChild(t);
  });
}

function updateTokenPositions() {
  const areaRect = $('game-board-area').getBoundingClientRect();
  const groups = {};
  state.players.forEach((p, i) => {
    if(!groups[p.pos]) groups[p.pos] = [];
    groups[p.pos].push(i);
  });

  for(let pos in groups) {
    const indices = groups[pos];
    let targetEl = pos == 0 ? $('dock-area') : $(`sq-${pos}`);
    if(!targetEl) continue;
    
    const rect = targetEl.getBoundingClientRect();
    const centerX = rect.left - areaRect.left + rect.width / 2;
    const centerY = rect.top - areaRect.top + rect.height / 2;
    
    const count = indices.length;
    const radius = window.innerWidth < 480 ? 10 : 16;
    
    indices.forEach((pIdx, clusterIdx) => {
      let ox = 0, oy = 0;
      if(count === 2) {
        ox = clusterIdx === 0 ? -radius : radius;
      } else if(count === 3) {
        if(clusterIdx === 0) { ox = -radius; oy = -radius; }
        if(clusterIdx === 1) { ox = radius; oy = -radius; }
        if(clusterIdx === 2) { oy = radius; }
      } else if(count === 4) {
        ox = (clusterIdx % 2 === 0 ? -1 : 1) * radius;
        oy = (clusterIdx < 2 ? -1 : 1) * radius;
      } else if(count === 5) {
        if(clusterIdx < 4) {
          ox = (clusterIdx % 2 === 0 ? -1 : 1) * radius;
          oy = (clusterIdx < 2 ? -1 : 1) * radius;
        }
      }
      
      const t = $(`token-${pIdx}`);
      if(t) {
        t.style.left = (centerX + ox) + 'px';
        t.style.top = (centerY + oy) + 'px';
      }
    });
  }
}

window.addEventListener('resize', updateTokenPositions);

// --- GAMEPLAY LOGIC ---
function updateUI() {
  const p = state.players[state.activeIndex];
  $('active-p-name').textContent = p.name;
  $('active-p-name').style.color = p.color;
  
  const list = $('player-list');
  list.innerHTML = '';
  state.players.forEach((pl, i) => {
    const row = document.createElement('div');
    row.className = `p-row ${i === state.activeIndex ? 'active-row' : ''}`;
    if(i === state.activeIndex) row.style.borderColor = pl.color;
    row.innerHTML = `
      <div class="p-dot" style="background:${pl.color}"></div>
      <div class="p-name">${escapeHTML(pl.name)}</div>
      <div class="p-score">🏆 ${pl.trophies.size}/5</div>
    `;
    list.appendChild(row);
  });
}

function msg(text) {
  $('status-text').textContent = text;
}

$('dice-btn').addEventListener('click', async (event) => {
  if(state.busy || state.gameOver) return;
  initAudio();
  const isCPU = state.mode === 'cpu' && state.activeIndex === 1;
  if(isCPU && event && event.isTrusted) return;

  state.busy = true;
  sounds.roll();
  msg("Rolling...");
  
  const cube = $('dice-cube');
  const result = Math.floor(Math.random() * 6) + 1;
  state.rolledValue = result;
  
  const rots = {
    1: {x: 0, y: 0},
    2: {x: -90, y: 0},
    3: {x: 0, y: -90},
    4: {x: 0, y: 90},
    5: {x: 90, y: 0},
    6: {x: 180, y: 0}
  };
  
  const baseSpinX = 720;
  const baseSpinY = 720;
  
  const finalX = baseSpinX + rots[result].x - 12;
  const finalY = baseSpinY + rots[result].y + 16;
  
  cube.style.transform = `rotateX(${finalX}deg) rotateY(${finalY}deg)`;
  
  await sleep(1000);
  
  cube.style.transition = 'none';
  cube.style.transform = `rotateX(${rots[result].x - 12}deg) rotateY(${rots[result].y + 16}deg)`;
  void cube.offsetWidth;
  cube.style.transition = 'transform 1s cubic-bezier(0.25, 0.8, 0.25, 1)';
  
  msg(`${state.players[state.activeIndex].name} rolled a ${result}!`);
  
  if(isCPU) {
    await sleep(800);
    executeMove();
  } else {
    $('move-btn').textContent = `Move ${result} space${result>1?'s':''}`;
    $('move-btn').style.display = 'block';
    state.busy = false;
  }
});

$('move-btn').addEventListener('click', () => {
  if(state.busy || state.gameOver) return;
  $('move-btn').style.display = 'none';
  state.busy = true;
  executeMove();
});

async function executeMove() {
  const pIdx = state.activeIndex;
  const p = state.players[pIdx];
  const target = p.pos + state.rolledValue;
  
  if(target > 20) {
    msg(`${p.name} needs an exact roll. The token stays put.`);
    sounds.blocked();
    await sleep(2000);
    nextTurn();
    return;
  }
  
  for(let i=1; i<=state.rolledValue; i++) {
    p.pos++;
    updateTokenPositions();
    const tEl = $(`token-${pIdx}`);
    if(tEl) tEl.classList.add('hop');
    sounds.step();
    await sleep(150);
    if(tEl) tEl.classList.remove('hop');
    await sleep(100);
  }
  
  await sleep(400);
  
  if(p.pos === 20) {
    triggerWin(p.name, "reached square 20!");
    return;
  }
  
  if(LADDERS[p.pos]) {
    const dest = LADDERS[p.pos];
    msg(`Ladder! ${p.name} climbs to square ${dest}.`);
    sounds.ladder();
    p.pos = dest;
    await sleep(800);
    updateTokenPositions();
    await sleep(800);
  } else if(SNAKES[p.pos]) {
    const dest = SNAKES[p.pos];
    msg(`Oh no! A snake bites ${p.name} and slides the token down to square ${dest}. 😭`);
    sounds.snake();
    p.pos = dest;
    await sleep(800);
    updateTokenPositions();
    await sleep(1200);
  }
  
  nextTurn();
}

async function nextTurn() {
  if(state.gameOver) return;
  state.activeIndex = (state.activeIndex + 1) % state.playerCount;
  updateUI();
  msg("Click the dice to roll.");
  state.busy = false;
  
  if(state.mode === 'cpu' && state.activeIndex === 1) {
    state.busy = true;
    msg("CPU is thinking...");
    await sleep(1000);
    $('dice-btn').click();
  }
}

// --- QUESTIONS & TROPHIES ---
function openQuestion(sq) {
  if(state.gameOver) return;
  const isCPU = state.mode === 'cpu' && state.activeIndex === 1;
  if(isCPU) return;
  if(state.busy && $('move-btn').style.display !== 'block') return;
  
  initAudio();
  const qData = state.questions[sq];
  if(!qData || !qData.q) {
    msg(`No question is saved for square ${sq} yet. Add it in settings.`);
    sounds.wrong();
    return;
  }
  
  state.openSquare = sq;
  $('q-modal-title').textContent = `Square ${sq} Question`;
  $('q-text').textContent = qData.q;
  $('q-input').value = '';
  $('q-feedback').textContent = '';
  $('q-modal').showModal();
}

$('btn-close-q').addEventListener('click', () => { sounds.click(); $('q-modal').close(); });
$('btn-check-q').addEventListener('click', checkAnswer);
$('q-input').addEventListener('keydown', (e) => { if(e.key === 'Enter') checkAnswer(); });

function checkAnswer() {
  const p = state.players[state.activeIndex];
  const sq = state.openSquare;
  const qData = state.questions[sq];
  const userAns = $('q-input').value.trim().replace(/\s+/g, ' ').toLowerCase();
  const correctAns = qData.a.trim().replace(/\s+/g, ' ').toLowerCase();
  
  if(userAns === correctAns) {
    if(p.trophies.has(sq)) {
      $('q-feedback').textContent = "Correct! You already earned the trophy for this square.";
      $('q-feedback').className = 'modal-feedback success';
      sounds.correct();
      setTimeout(()=>$('q-modal').close(), 2000);
    } else {
      p.trophies.add(sq);
      $('q-feedback').textContent = "Correct! Trophy earned! ✨🏆";
      $('q-feedback').className = 'modal-feedback success';
      sounds.trophy();
      updateUI();
      if(p.trophies.size >= 5) {
        setTimeout(() => {
          $('q-modal').close();
          p.pos = 20;
          updateTokenPositions();
          triggerWin(p.name, "collected five trophies!");
        }, 1500);
      } else {
        setTimeout(()=>$('q-modal').close(), 2000);
      }
    }
  } else {
    $('q-feedback').textContent = "Not quite—try again. Check spelling and spacing.";
    $('q-feedback').className = 'modal-feedback error';
    sounds.wrong();
  }
}

// --- VICTORY ---
function triggerWin(name, reason) {
  state.gameOver = true;
  state.busy = true;
  sounds.win();
  $('victory-msg').innerHTML = `<b>${escapeHTML(name)}</b> wins because they ${reason}`;
  $('victory-modal').showModal();
  generateConfetti();
}

function generateConfetti() {
  for(let i=0; i<90; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = -10 - Math.random() * 20 + 'vh';
    c.style.backgroundColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    c.style.animationDuration = 2 + Math.random() * 2 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

$('btn-play-again').addEventListener('click', () => {
  $('victory-modal').close();
  sounds.click();
  $('btn-restart').click();
});

// --- CONTROLS ---
$('btn-back').addEventListener('click', () => {
  sounds.click();
  $('game-view').style.display = 'none';
  $('settings-view').style.display = 'block';
  state.gameOver = true;
  $('q-modal').close();
  $('victory-modal').close();
});

$('btn-restart').addEventListener('click', () => {
  sounds.click();
  $('q-modal').close();
  $('victory-modal').close();
  startGame();
});

$('sound-toggle').addEventListener('click', (e) => {
  state.sound = !state.sound;
  const btn = e.target;
  btn.setAttribute('aria-pressed', state.sound);
  btn.textContent = state.sound ? '🔊 Sound on' : '🔇 Sound off';
  if(state.sound) { initAudio(); sounds.click(); }
});

// INIT
window.addEventListener('DOMContentLoaded', () => {
  $('player-count-box').querySelector('[data-count="2"]').classList.add('active');
  loadSettings();
});

</script>
</body>
